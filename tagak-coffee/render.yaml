services:
  - type: web
    name: tagak-staging
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /unified-login/index.html
    autoDeploy: false
    disk:
      name: tagak-uploads
      mountPath: /app/server/uploads
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: ORDER_LISTEN_DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SUPER_ADMIN_EMAIL
        value: tagakcafe@gmail.com
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: PIN_HMAC_KEY
        sync: false
      - key: XENDIT_SECRET_KEY
        sync: false
      - key: XENDIT_WEBHOOK_TOKEN
        sync: false
      - key: XENDIT_QR_ENABLED
        sync: false
      - key: ALLOW_PAYMENT_SIMULATION
        sync: false
